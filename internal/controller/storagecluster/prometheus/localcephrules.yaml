# Groups mon, osd, mds, mgr, pgs, pools, healthchecks, rados, and generic below are
# copied from https://github.com/ceph/ceph/blob/4b5096cc0de40a1b80bf801b4261bb58b0702e82/monitoring/ceph-mixin/prometheus_alerts.yml
# Attention: This is not a 1:1 copy of ceph-mixin alerts. This file contains several ODF-related adjustments.
#   List of main adjustments:
#     - Alerts related to cephadm are excluded (ceph-mixin upstream already separates these)
#     - The nvmeof, PrometheusServer, and certmgr groups are excluded: NVMe-oF, Prometheus
#       self-monitoring, and cert-manager integration are not in scope for this file
#     - The "cluster health", "rbdmirror", "nodes", and "hardware" groups are excluded
#     - CephMonDownQuorumAtRisk, CephOSDDown, CephOSDNearFull, CephOSDFlapping, CephPoolFull,
#       CephPoolNearFull, and CephSlowOps are dropped, because the groups above in this same
#       file already have an alert covering the same condition, under a different name/threshold
#     - CephDeviceFailurePredictionTooHigh and CephOSDDownHigh are excluded
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    prometheus: rook-prometheus
    role: alert-rules
  name: prometheus-ceph-rules
  namespace: rook-ceph
spec:
  groups:
  - name: ceph.rules
    rules:
    - expr: |
        kube_node_status_condition{condition="Ready",job="kube-state-metrics",status="true"} * on (node) group_right() max by (node, namespace) (label_replace(ceph_disk_occupation{job="rook-ceph-mgr"},"node","$1","instance","(.*)"))
      record: cluster:ceph_node_down:join_kube
    - expr: |
        avg by (namespace, managedBy) (topk by (ceph_daemon, namespace, managedBy) (1, label_replace(ceph_disk_occupation{job="rook-ceph-mgr"}, "device", "$1", "device", "/dev/(.*)")) * on(instance, device) group_right(ceph_daemon, namespace, managedBy) topk by (instance, device, namespace, managedBy) (1,(irate(node_disk_read_time_seconds_total[1m]) + irate(node_disk_write_time_seconds_total[1m]) / (clamp_min(irate(node_disk_reads_completed_total[1m]), 1) + irate(node_disk_writes_completed_total[1m])))))
      record: cluster:ceph_disk_latency:join_ceph_node_disk_irate1m
  - name: telemeter.rules
    rules:
    - expr: |
        count by (namespace, managedBy) (ceph_osd_metadata{job=~"rook-ceph-mgr|rook-ceph-mgr-external"})
      record: job:ceph_osd_metadata:count
    - expr: |
        count by (namespace) (kube_persistentvolume_info * on (storageclass) group_left(provisioner, namespace) kube_storageclass_info {provisioner=~"(.*rbd.csi.ceph.com)|(.*cephfs.csi.ceph.com)|(.*topolvm.cybozu.com)"})
      record: job:odf_system_pvs:count
    - expr: |
        sum by (namespace, managedBy) (ceph_pool_rd{job=~"rook-ceph-mgr|rook-ceph-mgr-external"} + on(pool_id, namespace, managedBy) ceph_pool_wr)
      record: job:ceph_pools_iops:total
    - expr: |
        sum by (namespace, managedBy) (ceph_pool_rd_bytes{job=~"rook-ceph-mgr|rook-ceph-mgr-external"} + on(pool_id, namespace, managedBy) ceph_pool_wr_bytes)
      record: job:ceph_pools_iops_bytes:total
    - expr: |
        count by (namespace, managedBy) (count by (ceph_version, namespace, managedBy) (ceph_mon_metadata{job=~"rook-ceph-mgr|rook-ceph-mgr-external"} or ceph_osd_metadata{job=~"rook-ceph-mgr|rook-ceph-mgr-external"} or ceph_rgw_metadata{job=~"rook-ceph-mgr|rook-ceph-mgr-external"} or ceph_mds_metadata{job=~"rook-ceph-mgr|rook-ceph-mgr-external"} or ceph_mgr_metadata{job=~"rook-ceph-mgr|rook-ceph-mgr-external"}))
      record: job:ceph_versions_running:count
  - name: ceph-mgr-status
    rules:
    - alert: CephMgrIsAbsent
      annotations:
        description: Ceph Manager has disappeared from Prometheus target discovery.
        message: Storage metrics collector service not available anymore.
        severity_level: critical
        storage_type: ceph
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/openshift-container-storage-operator/CephMgrIsAbsent.md
      expr: |
        label_replace((up{job="rook-ceph-mgr"} == 0 or absent(up{job="rook-ceph-mgr"})), "namespace", "openshift-storage", "", "")
      for: 5m
      labels:
        severity: critical
    - alert: CephMgrIsMissingReplicas
      annotations:
        description: Ceph Manager is missing replicas.
        message: Storage metrics collector service doesn't have required no of replicas.
        severity_level: warning
        storage_type: ceph
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/openshift-container-storage-operator/CephMgrIsMissingReplicas.md
      expr: |
        sum by (namespace) (kube_deployment_spec_replicas{deployment=~"rook-ceph-mgr-.*"}) < 1
      for: 5m
      labels:
        severity: warning
  - name: ceph-mds-status
    rules:
    - alert: CephMdsMissingReplicas
      annotations:
        description: Minimum required replicas for storage metadata service not available. Might affect the working of storage cluster.
        message: Insufficient replicas for storage metadata service.
        severity_level: warning
        storage_type: ceph
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/openshift-container-storage-operator/CephMdsMissingReplicas.md
      expr: |
        sum by (namespace, managedBy) (ceph_mds_metadata{job=~"rook-ceph-mgr|rook-ceph-mgr-external"} == 1) < 2
      for: 5m
      labels:
        severity: warning
  - name: quorum-alert.rules
    rules:
    - alert: CephMonQuorumAtRisk
      annotations:
        description: Storage cluster quorum is low. Contact Support.
        message: Storage quorum at risk
        severity_level: error
        storage_type: ceph
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/openshift-container-storage-operator/CephMonQuorumAtRisk.md
      expr: |
        count by (namespace, managedBy) (ceph_mon_quorum_status{job=~"rook-ceph-mgr|rook-ceph-mgr-external"} == 1) <= (floor(count by (namespace, managedBy) (ceph_mon_metadata{job=~"rook-ceph-mgr|rook-ceph-mgr-external"}) / 2) + 1)
      for: 15m
      labels:
        severity: critical
    - alert: CephMonQuorumLost
      annotations:
        description: Storage cluster quorum is lost. Contact Support.
        message: Storage quorum is lost
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/openshift-container-storage-operator/CephMonQuorumLost.md
        severity_level: critical
        storage_type: ceph
      expr: |
        count by (namespace) (kube_pod_status_phase{pod=~"rook-ceph-mon-.*", phase=~"Running|running"} == 1) < 2
      for: 5m
      labels:
        severity: critical
    - alert: CephMonHighNumberOfLeaderChanges
      annotations:
        description: Ceph Monitor {{ $labels.ceph_daemon }} on host {{ $labels.hostname }} has seen {{ $value | printf "%.2f" }} leader changes per minute recently.
        message: Storage Cluster has seen many leader changes recently.
        severity_level: warning
        storage_type: ceph
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/openshift-container-storage-operator/CephMonHighNumberOfLeaderChanges.md
      expr: |
        (ceph_mon_metadata{job=~"rook-ceph-mgr|rook-ceph-mgr-external"} * on (ceph_daemon, namespace, managedBy) group_left() (rate(ceph_mon_num_elections{job="rook-ceph-exporter"}[5m]) * 60)) > 0.95
      for: 5m
      labels:
        severity: warning
  - name: ceph-node-alert.rules
    rules:
    - alert: CephNodeDown
      annotations:
        description: Storage node {{ $labels.node }} went down. Please check the node immediately.
        message: Storage node {{ $labels.node }} went down
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/openshift-container-storage-operator/CephNodeDown.md
        severity_level: error
        storage_type: ceph
      expr: |
        cluster:ceph_node_down:join_kube == 0
      for: 30s
      labels:
        severity: critical
  - name: osd-alert.rules
    rules:
    - alert: CephOSDCriticallyFull
      annotations:
        description: Utilization of storage device {{ $labels.ceph_daemon }} of device_class type {{ $labels.device_class }} has crossed 80% on host {{ $labels.hostname }}. Immediately free up some space or add capacity of type {{ $labels.device_class }}.
        message: Back-end storage device is critically full.
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/openshift-container-storage-operator/CephOSDCriticallyFull.md
        severity_level: error
        storage_type: ceph
      expr: |
        (ceph_osd_metadata * on (ceph_daemon, namespace, managedBy) group_right(device_class,hostname) (ceph_osd_stat_bytes_used / ceph_osd_stat_bytes)) >= 0.80
      for: 40s
      labels:
        severity: critical
    - alert: CephOSDFlapping
      annotations:
        description: Storage daemon {{ $labels.ceph_daemon }} has restarted 10 times in last 5 minutes. Please check the pod events or ceph status to find out the cause.
        message: Ceph storage osd flapping.
        severity_level: error
        storage_type: ceph
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/openshift-container-storage-operator/CephOSDFlapping.md
      expr: |
        changes(ceph_osd_up[5m]) >= 10
      for: 0s
      labels:
        severity: critical
    - alert: CephOSDNearFull
      annotations:
        description: Utilization of storage device {{ $labels.ceph_daemon }} of device_class type {{ $labels.device_class }} has crossed 75% on host {{ $labels.hostname }}. Immediately free up some space or add capacity of type {{ $labels.device_class }}.
        message: Back-end storage device is nearing full.
        severity_level: warning
        storage_type: ceph
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/openshift-container-storage-operator/CephOSDNearFull.md
      expr: |
        (ceph_osd_metadata * on (ceph_daemon, namespace, managedBy) group_right(device_class,hostname) (ceph_osd_stat_bytes_used / ceph_osd_stat_bytes)) >= 0.75
      for: 40s
      labels:
        severity: warning
    - alert: CephOSDDiskNotResponding
      annotations:
        description: Disk device {{ $labels.device }} not responding, on host {{ $labels.host }}.
        message: Disk not responding
        severity_level: error
        storage_type: ceph
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/openshift-container-storage-operator/CephOSDDiskNotResponding.md
      expr: |
        label_replace((ceph_osd_in == 1 and ceph_osd_up == 0),"disk","$1","ceph_daemon","osd.(.*)") + on(ceph_daemon, namespace, managedBy) group_left(host, device) label_replace(ceph_disk_occupation{job=~"rook-ceph-mgr|rook-ceph-mgr-external"},"host","$1","instance","(.*)")
      for: 15m
      labels:
        severity: critical
    - alert: CephOSDDiskUnavailable
      annotations:
        description: Disk device {{ $labels.device }} not accessible on host {{ $labels.host }}.
        message: Disk not accessible
        severity_level: error
        storage_type: ceph
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/openshift-container-storage-operator/CephOSDDiskUnavailable.md
      expr: |
        label_replace((ceph_osd_in == 0 and ceph_osd_up == 0),"disk","$1","ceph_daemon","osd.(.*)") + on(ceph_daemon, namespace, managedBy) group_left(host, device) label_replace(ceph_disk_occupation{job=~"rook-ceph-mgr|rook-ceph-mgr-external"},"host","$1","instance","(.*)")
      for: 1m
      labels:
        severity: critical
    - alert: CephOSDDown
      annotations:
        description: Ceph OSD(s) is/are down, please check the ceph-osd daemons and take corrective measures. Please see runbook URL for more details
        message: An OSD has been marked down
        severity_level: warning
        storage_type: ceph
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/openshift-container-storage-operator/CephOSDDown.md
      expr: |
        ceph_health_detail{name="OSD_DOWN"} == 1
      for: 5m
      labels:
        severity: warning
    - alert: CephOSDSlowOps
      annotations:
        description: '{{ $value }} Ceph OSD requests are taking too long to process. Please check ceph status to find out the cause.'
        message: OSD requests are taking too long to process.
        severity_level: warning
        storage_type: ceph
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/openshift-container-storage-operator/CephOSDSlowOps.md
      expr: |
        ceph_healthcheck_slow_ops > 0
      for: 30s
      labels:
        severity: warning
    - alert: CephDataRecoveryTakingTooLong
      annotations:
        description: Data recovery has been active for too long. Contact Support.
        message: Data recovery is slow
        severity_level: warning
        storage_type: ceph
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/openshift-container-storage-operator/CephDataRecoveryTakingTooLong.md
      expr: |
        ceph_pg_undersized > 0
      for: 2h
      labels:
        severity: warning
    - alert: CephPGRepairTakingTooLong
      annotations:
        description: Self heal operations taking too long. Contact Support.
        message: Self heal problems detected
        severity_level: warning
        storage_type: ceph
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/openshift-container-storage-operator/CephPgRepairTakingTooLong.md
      expr: |
        ceph_pg_inconsistent > 0
      for: 1h
      labels:
        severity: warning
  - name: cluster-state-alert.rules
    rules:
    - alert: CephClusterErrorState
      annotations:
        description: Storage cluster is in error state for more than 10m.
        message: Storage cluster is in error state
        severity_level: error
        storage_type: ceph
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/openshift-container-storage-operator/CephClusterErrorState.md
      expr: |
        ceph_health_status{job="rook-ceph-mgr"} > 1
      for: 10m
      labels:
        severity: critical
    - alert: CephClusterWarningState
      annotations:
        description: Storage cluster is in warning state for more than 15m.
        message: Storage cluster is in degraded state
        severity_level: warning
        storage_type: ceph
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/openshift-container-storage-operator/CephClusterWarningState.md
      expr: |
        ceph_health_status{job="rook-ceph-mgr"} == 1
      for: 15m
      labels:
        severity: warning
    - alert: CephOSDVersionMismatch
      annotations:
        description: There are {{ $value }} different versions of Ceph OSD components running.
        message: There are multiple versions of storage services running.
        severity_level: warning
        storage_type: ceph
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/openshift-container-storage-operator/CephOSDVersionMismatch.md
      expr: |
        count by (namespace, managedBy) (count by (ceph_version, namespace, managedBy) (ceph_osd_metadata{job="rook-ceph-mgr|rook-ceph-mgr-external", ceph_version != ""})) > 1
      for: 10m
      labels:
        severity: warning
    - alert: CephMonVersionMismatch
      annotations:
        description: There are {{ $value }} different versions of Ceph Mon components running.
        message: There are multiple versions of storage services running.
        severity_level: warning
        storage_type: ceph
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/openshift-container-storage-operator/CephMonVersionMismatch.md
      expr: |
        count by (namespace, managedBy) (count by (ceph_version, namespace, managedBy) (ceph_mon_metadata{job="rook-ceph-mgr|rook-ceph-mgr-external", ceph_version != ""})) > 1
      for: 10m
      labels:
        severity: warning
  - name: cluster-utilization-alert.rules
    rules:
    - alert: CephClusterNearFull
      annotations:
        description: Storage cluster utilization has crossed 75% and will become read-only at 85%. Free up some space or expand the storage cluster.
        message: Storage cluster is nearing full. Data deletion or cluster expansion is required.
        severity_level: warning
        storage_type: ceph
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/openshift-container-storage-operator/CephClusterNearFull.md
      expr: |
        ceph_cluster_total_used_raw_bytes / ceph_cluster_total_bytes > 0.75
      for: 5s
      labels:
        severity: warning
    - alert: CephClusterCriticallyFull
      annotations:
        description: Storage cluster utilization has crossed 80% and will become read-only at 85%. Free up some space or expand the storage cluster immediately.
        message: Storage cluster is critically full and needs immediate data deletion or cluster expansion.
        severity_level: error
        storage_type: ceph
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/openshift-container-storage-operator/CephClusterCriticallyFull.md
      expr: |
        ceph_cluster_total_used_raw_bytes / ceph_cluster_total_bytes > 0.80
      for: 5s
      labels:
        severity: critical
    - alert: CephClusterReadOnly
      annotations:
        description: Storage cluster utilization has crossed 85% and will become read-only now. Free up some space or expand the storage cluster immediately.
        message: Storage cluster is read-only now and needs immediate data deletion or cluster expansion.
        severity_level: error
        storage_type: ceph
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/openshift-container-storage-operator/CephClusterReadOnly.md
      expr: |
        ceph_cluster_total_used_raw_bytes / ceph_cluster_total_bytes >= 0.85
      for: 0s
      labels:
        severity: critical
  - name: pool-usage-alert.rules
    rules:
    - alert: CephPoolNearFull
      annotations:
        description: One or more storage pools are approaching capacity limits on storage cluster {{ $labels.managedBy }}. Consider adding more storage capacity.
        message: Storage pool is nearly full on cluster {{ $labels.managedBy }}.
        severity_level: warning
        storage_type: ceph
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/openshift-container-storage-operator/CephPoolNearFull.md
      expr: |
        ceph_health_detail{name="POOL_NEARFULL"} > 0
      for: 1m
      labels:
        severity: warning
    - alert: CephPoolFull
      annotations:
        description: One or more storage pools have reached maximum capacity on storage cluster {{ $labels.managedBy }}. Write operations to affected pools are blocked. This is a critical condition requiring immediate intervention, add storage capacity immediately.
        message: storage pool is full on cluster {{ $labels.managedBy }}, write operations are blocked.
        severity_level: critical
        storage_type: ceph
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/openshift-container-storage-operator/CephPoolFull.md
      expr: |
        ceph_health_detail{name="POOL_FULL"} > 0
      for: 5s
      labels:
        severity: critical
  - name: pool-quota.rules
    rules:
    - alert: CephPoolQuotaBytesNearExhaustion
      annotations:
        description: Storage pool {{ $labels.name }} quota usage has crossed 70%.
        message: Storage pool quota(bytes) is near exhaustion.
        severity_level: warning
        storage_type: ceph
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/openshift-container-storage-operator/CephPoolQuotaBytesNearExhaustion.md
      expr: |
        (ceph_pool_stored * on (pool_id, managedBy) group_left(name, namespace)ceph_pool_metadata) / ((ceph_pool_quota_bytes * on (pool_id, managedBy) group_left(name, namespace)ceph_pool_metadata) > 0) > 0.70
      for: 1m
      labels:
        severity: warning
    - alert: CephPoolQuotaBytesCriticallyExhausted
      annotations:
        description: Storage pool {{ $labels.name }} quota usage has crossed 90%.
        message: Storage pool quota(bytes) is critically exhausted.
        severity_level: critical
        storage_type: ceph
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/openshift-container-storage-operator/CephPoolQuotaBytesCriticallyExhausted.md
      expr: |
        (ceph_pool_stored * on (pool_id, managedBy) group_left(name, namespace)ceph_pool_metadata) / ((ceph_pool_quota_bytes * on (pool_id, managedBy) group_left(name, namespace)ceph_pool_metadata) > 0) > 0.90
      for: 1m
      labels:
        severity: critical
  - name: mon
    rules:
    - alert: CephMonDown
      annotations:
        description: "{{ $down := printf \"count(ceph_mon_quorum_status{cluster='%s'} == 0)\" .Labels.cluster | query | first | value }}{{ $s := \"\" }}{{ if gt $down 1.0 }}{{ $s = \"s\" }}{{ end }}You have {{ $down }} monitor{{ $s }} down. Quorum is still intact, but the loss of an additional monitor will make your cluster inoperable. The following monitors are down: {{- range printf \"(ceph_mon_quorum_status{cluster='%s'} == 0) + on(cluster,ceph_daemon) group_left(hostname) (ceph_mon_metadata * 0)\" .Labels.cluster | query }} - {{ .Labels.ceph_daemon }} on {{ .Labels.hostname }} {{- end }}"
        documentation: https://docs.ceph.com/en/latest/rados/operations/health-checks#mon-down
        summary: One or more monitors down on cluster {{ $labels.cluster }}
      expr: |
        (count by (cluster) (ceph_mon_quorum_status == 0)) <= (count by (cluster) (ceph_mon_metadata) - floor((count by (cluster) (ceph_mon_metadata) / 2 + 1)))
      for: 30s
      labels:
        severity: warning
        type: ceph_default
    - alert: CephMonDiskspaceCritical
      annotations:
        description: The free space available to a monitor's store is critically low. You should increase the space available to the monitor(s). The default directory is /var/lib/ceph/mon-*/data/store.db on traditional deployments, and /var/lib/rook/mon-*/data/store.db on the mon pod's worker node for Rook. Look for old, rotated versions of *.log and MANIFEST*. Do NOT touch any *.sst files. Also check any other directories under /var/lib/rook and other directories on the same filesystem, often /var/log and /var/tmp are culprits. Your monitor hosts are; {{- range query "ceph_mon_metadata"}} - {{ .Labels.hostname }} {{- end }}
        documentation: https://docs.ceph.com/en/latest/rados/operations/health-checks#mon-disk-crit
        summary: Filesystem space on at least one monitor is critically low on cluster {{ $labels.cluster }}
      expr: |
        ceph_health_detail{name="MON_DISK_CRIT"} == 1
      for: 1m
      labels:
        oid: 1.3.6.1.4.1.50495.1.2.1.3.2
        severity: critical
        type: ceph_default
    - alert: CephMonDiskspaceLow
      annotations:
        description: The space available to a monitor's store is approaching full (>70% is the default). You should increase the space available to the monitor(s). The default directory is /var/lib/ceph/mon-*/data/store.db on traditional deployments, and /var/lib/rook/mon-*/data/store.db on the mon pod's worker node for Rook. Look for old, rotated versions of *.log and MANIFEST*.  Do NOT touch any *.sst files. Also check any other directories under /var/lib/rook and other directories on the same filesystem, often /var/log and /var/tmp are culprits. Your monitor hosts are; {{- range query "ceph_mon_metadata"}} - {{ .Labels.hostname }} {{- end }}
        documentation: https://docs.ceph.com/en/latest/rados/operations/health-checks#mon-disk-low
        summary: Drive space on at least one monitor is approaching full on cluster {{ $labels.cluster }}
      expr: |
        ceph_health_detail{name="MON_DISK_LOW"} == 1
      for: 5m
      labels:
        severity: warning
        type: ceph_default
    - alert: CephMonClockSkew
      annotations:
        description: Ceph monitors rely on closely synchronized time to maintain quorum and cluster consistency. This event indicates that the time on at least one mon has drifted too far from the lead mon. Review cluster status with ceph -s. This will show which monitors are affected. Check the time sync status on each monitor host with 'ceph time-sync-status' and the state and peers of your ntpd or chrony daemon.
        documentation: https://docs.ceph.com/en/latest/rados/operations/health-checks#mon-clock-skew
        summary: Clock skew detected among monitors on cluster {{ $labels.cluster }}
      expr: |
        ceph_health_detail{name="MON_CLOCK_SKEW"} == 1
      for: 1m
      labels:
        severity: warning
        type: ceph_default
  - name: osd
    rules:
    - alert: CephOSDHostDown
      annotations:
        description: "The following OSDs are down: {{- range printf \"(ceph_osd_up{cluster='%s'} * on(cluster,ceph_daemon) group_left(hostname) ceph_osd_metadata) == 0\" .Labels.cluster | query }} - {{ .Labels.hostname }} : {{ .Labels.ceph_daemon }} {{- end }}"
        summary: An OSD host is offline on cluster {{ $labels.cluster }}
      expr: |
        ceph_health_detail{name="OSD_HOST_DOWN"} == 1
      for: 5m
      labels:
        oid: 1.3.6.1.4.1.50495.1.2.1.4.8
        severity: warning
        type: ceph_default
    - alert: CephOSDFull
      annotations:
        description: An OSD has reached the FULL threshold. Writes to pools that share the affected OSD will be blocked. Use 'ceph health detail' and 'ceph osd df' to identify the problem. To resolve, add capacity to the affected OSD's failure domain, restore down/out OSDs, or delete unwanted data.
        documentation: https://docs.ceph.com/en/latest/rados/operations/health-checks#osd-full
        summary: OSD full, writes blocked on cluster {{ $labels.cluster }}
      expr: |
        ceph_health_detail{name="OSD_FULL"} > 0
      for: 1m
      labels:
        oid: 1.3.6.1.4.1.50495.1.2.1.4.6
        severity: critical
        type: ceph_default
    - alert: CephOSDBackfillFull
      annotations:
        description: An OSD has reached the BACKFILL FULL threshold. This will prevent rebalance operations from completing. Use 'ceph health detail' and 'ceph osd df' to identify the problem. To resolve, add capacity to the affected OSD's failure domain, restore down/out OSDs, or delete unwanted data.
        documentation: https://docs.ceph.com/en/latest/rados/operations/health-checks#osd-backfillfull
        summary: OSD(s) too full for backfill operations on cluster {{ $labels.cluster }}
      expr: |
        ceph_health_detail{name="OSD_BACKFILLFULL"} > 0
      for: 1m
      labels:
        severity: warning
        type: ceph_default
    - alert: CephOSDTooManyRepairs
      annotations:
        description: Reads from an OSD have used a secondary PG to return data to the client, indicating a potential failing drive.
        documentation: https://docs.ceph.com/en/latest/rados/operations/health-checks#osd-too-many-repairs
        summary: OSD reports a high number of read errors on cluster {{ $labels.cluster }}
      expr: |
        ceph_health_detail{name="OSD_TOO_MANY_REPAIRS"} == 1
      for: 30s
      labels:
        severity: warning
        type: ceph_default
    - alert: CephOSDTimeoutsPublicNetwork
      annotations:
        description: OSD heartbeats on the cluster's 'public' network (frontend) are running slow. Investigate the network for latency or loss issues. Use 'ceph health detail' to show the affected OSDs.
        summary: Network issues delaying OSD heartbeats (public network) on cluster {{ $labels.cluster }}
      expr: |
        ceph_health_detail{name="OSD_SLOW_PING_TIME_FRONT"} == 1
      for: 1m
      labels:
        severity: warning
        type: ceph_default
    - alert: CephOSDTimeoutsClusterNetwork
      annotations:
        description: OSD heartbeats on the cluster's 'cluster' network (backend) are slow. Investigate the network for latency issues on this subnet. Use 'ceph health detail' to show the affected OSDs.
        summary: Network issues delaying OSD heartbeats (cluster network) on cluster {{ $labels.cluster }}
      expr: |
        ceph_health_detail{name="OSD_SLOW_PING_TIME_BACK"} == 1
      for: 1m
      labels:
        severity: warning
        type: ceph_default
    - alert: CephOSDInternalDiskSizeMismatch
      annotations:
        description: One or more OSDs have an internal inconsistency between metadata and the size of the device. This could lead to the OSD(s) crashing in future. You should redeploy the affected OSDs.
        documentation: https://docs.ceph.com/en/latest/rados/operations/health-checks#bluestore-disk-size-mismatch
        summary: OSD size inconsistency error on cluster {{ $labels.cluster }}
      expr: |
        ceph_health_detail{name="BLUESTORE_DISK_SIZE_MISMATCH"} == 1
      for: 1m
      labels:
        severity: warning
        type: ceph_default
    - alert: CephDeviceFailurePredicted
      annotations:
        description: The device health module has determined that one or more devices will fail soon. To review device status use 'ceph device ls'. To show a specific device use 'ceph device info <dev id>'. Mark the OSD out so that data may migrate to other OSDs. Once the OSD has drained, destroy the OSD, replace the device, and redeploy the OSD.
        documentation: https://docs.ceph.com/en/latest/rados/operations/health-checks#id2
        summary: Device(s) predicted to fail soon on cluster {{ $labels.cluster }}
      expr: |
        ceph_health_detail{name="DEVICE_HEALTH"} == 1
      for: 1m
      labels:
        severity: warning
        type: ceph_default
    - alert: CephDeviceFailureRelocationIncomplete
      annotations:
        description: The device health module has determined that one or more devices will fail soon, but the normal process of relocating the data on the device to other OSDs in the cluster is blocked. Ensure that the cluster has available free space. It may be necessary to add capacity to the cluster to allow data from the failing device to successfully migrate, or to enable the balancer.
        documentation: https://docs.ceph.com/en/latest/rados/operations/health-checks#device-health-in-use
        summary: Device failure is predicted, but unable to relocate data on cluster {{ $labels.cluster }}
      expr: |
        ceph_health_detail{name="DEVICE_HEALTH_IN_USE"} == 1
      for: 1m
      labels:
        severity: warning
        type: ceph_default
    - alert: CephOSDReadErrors
      annotations:
        description: An OSD has encountered read errors, but the OSD has recovered by retrying the reads. This may indicate an issue with hardware or the kernel.
        documentation: https://docs.ceph.com/en/latest/rados/operations/health-checks#bluestore-spurious-read-errors
        summary: Device read errors detected on cluster {{ $labels.cluster }}
      expr: |
        ceph_health_detail{name="BLUESTORE_SPURIOUS_READ_ERRORS"} == 1
      for: 30s
      labels:
        severity: warning
        type: ceph_default
    - alert: CephPGImbalance
      annotations:
        description: OSD {{ $labels.ceph_daemon }} on {{ $labels.hostname }} deviates by more than 30% from average PG count in the device class {{ $labels.device_class }}.
        summary: PGs are not balanced across OSDs on cluster {{ $labels.cluster }}
      expr: |
        abs(
          (
            (
              (ceph_osd_numpg > 0)
              * on (cluster, job, ceph_daemon) group_left(hostname, device_class) ceph_osd_metadata
            )
            - on (cluster, job, device_class) group_left avg(
                (ceph_osd_numpg > 0)
                * on (cluster, job, ceph_daemon) group_left(hostname, device_class) ceph_osd_metadata
              ) by (cluster, job, device_class)
          )
          / on (cluster, job, device_class) group_left avg(
              (ceph_osd_numpg > 0)
              * on (cluster, job, ceph_daemon) group_left(hostname, device_class) ceph_osd_metadata
            ) by (cluster, job, device_class)
        ) > 0.30
      for: 5m
      labels:
        oid: 1.3.6.1.4.1.50495.1.2.1.4.5
        severity: warning
        type: ceph_default
  - name: mds
    rules:
    - alert: CephFilesystemDamaged
      annotations:
        description: Filesystem metadata has been corrupted. Data may be inaccessible. Analyze metrics from the MDS daemon admin socket, or escalate to support.
        documentation: https://docs.ceph.com/en/latest/cephfs/health-messages#cephfs-health-messages
        summary: CephFS filesystem is damaged on cluster {{ $labels.cluster }}
      expr: |
        ceph_health_detail{name="MDS_DAMAGE"} > 0
      for: 1m
      labels:
        oid: 1.3.6.1.4.1.50495.1.2.1.5.1
        severity: critical
        type: ceph_default
    - alert: CephFilesystemOffline
      annotations:
        description: All MDS ranks are unavailable. The MDS daemons managing metadata are down, rendering the filesystem offline.
        documentation: https://docs.ceph.com/en/latest/cephfs/health-messages/#mds-all-down
        summary: CephFS filesystem is offline on cluster {{ $labels.cluster }}
      expr: |
        ceph_health_detail{name="MDS_ALL_DOWN"} > 0
      for: 1m
      labels:
        oid: 1.3.6.1.4.1.50495.1.2.1.5.3
        severity: critical
        type: ceph_default
    - alert: CephFilesystemDegraded
      annotations:
        description: One or more metadata daemons (MDS ranks) are failed or in a damaged state. At best the filesystem is partially available, at worst the filesystem is completely unusable.
        documentation: https://docs.ceph.com/en/latest/cephfs/health-messages/#fs-degraded
        summary: CephFS filesystem is degraded on cluster {{ $labels.cluster }}
      expr: |
        ceph_health_detail{name="FS_DEGRADED"} > 0
      for: 1m
      labels:
        oid: 1.3.6.1.4.1.50495.1.2.1.5.4
        severity: critical
        type: ceph_default
    - alert: CephFilesystemMDSRanksLow
      annotations:
        description: The filesystem's 'max_mds' setting defines the number of MDS ranks in the filesystem. The current number of active MDS daemons is less than this value.
        documentation: https://docs.ceph.com/en/latest/cephfs/health-messages/#mds-up-less-than-max
        summary: Ceph MDS daemon count is lower than configured on cluster {{ $labels.cluster }}
      expr: |
        ceph_health_detail{name="MDS_UP_LESS_THAN_MAX"} > 0
      for: 1m
      labels:
        severity: warning
        type: ceph_default
    - alert: CephFilesystemInsufficientStandby
      annotations:
        description: The minimum number of standby daemons required by standby_count_wanted is less than the current number of standby daemons. Adjust the standby count or increase the number of MDS daemons.
        documentation: https://docs.ceph.com/en/latest/cephfs/health-messages/#mds-insufficient-standby
        summary: Ceph filesystem standby daemons too few on cluster {{ $labels.cluster }}
      expr: |
        ceph_health_detail{name="MDS_INSUFFICIENT_STANDBY"} > 0
      for: 1m
      labels:
        severity: warning
        type: ceph_default
    - alert: CephFilesystemFailureNoStandby
      annotations:
        description: An MDS daemon has failed, leaving only one active rank and no available standby. Investigate the cause of the failure or add a standby MDS.
        documentation: https://docs.ceph.com/en/latest/cephfs/health-messages/#fs-with-failed-mds
        summary: MDS daemon failed, no further standby available on cluster {{ $labels.cluster }}
      expr: |
        ceph_health_detail{name="FS_WITH_FAILED_MDS"} > 0
      for: 1m
      labels:
        oid: 1.3.6.1.4.1.50495.1.2.1.5.5
        severity: critical
        type: ceph_default
    - alert: CephFilesystemReadOnly
      annotations:
        description: The filesystem has switched to READ ONLY due to an unexpected error when writing to the metadata pool. Either analyze the output from the MDS daemon admin socket, or escalate to support.
        documentation: https://docs.ceph.com/en/latest/cephfs/health-messages#cephfs-health-messages
        summary: CephFS filesystem in read only mode due to write error(s) on cluster {{ $labels.cluster }}
      expr: |
        ceph_health_detail{name="MDS_HEALTH_READ_ONLY"} > 0
      for: 1m
      labels:
        oid: 1.3.6.1.4.1.50495.1.2.1.5.2
        severity: critical
        type: ceph_default
  - name: mgr
    rules:
    - alert: CephMgrModuleCrash
      annotations:
        description: One or more mgr modules have crashed and have yet to be acknowledged by an administrator. A crashed module may impact functionality within the cluster. Use the 'ceph crash' command to determine which module has failed, and archive it to acknowledge the failure.
        documentation: https://docs.ceph.com/en/latest/rados/operations/health-checks#recent-mgr-module-crash
        summary: A manager module has recently crashed on cluster {{ $labels.cluster }}
      expr: |
        ceph_health_detail{name="RECENT_MGR_MODULE_CRASH"} == 1
      for: 5m
      labels:
        oid: 1.3.6.1.4.1.50495.1.2.1.6.1
        severity: critical
        type: ceph_default
    - alert: CephMgrPrometheusModuleInactive
      annotations:
        description: The mgr/prometheus module at {{ $labels.instance }} is unreachable. This could mean that the module has been disabled or the mgr daemon itself is down. Without the mgr/prometheus module metrics and alerts will no longer function. Open a shell to an admin node or toolbox pod and use 'ceph -s' to to determine whether the mgr is active. If the mgr is not active, restart it, otherwise you can determine module status with 'ceph mgr module ls'. If it is not listed as enabled, enable it with 'ceph mgr module enable prometheus'.
        summary: The mgr/prometheus module is not available
      expr: |
        up{job="ceph"} == 0
      for: 1m
      labels:
        oid: 1.3.6.1.4.1.50495.1.2.1.6.2
        severity: critical
        type: ceph_default
  - name: pgs
    rules:
    - alert: CephPGsInactive
      annotations:
        description: '{{ $value }} PGs have been inactive for more than 5 minutes in pool {{ $labels.name }}. Inactive placement groups are not able to serve read/write requests.'
        summary: One or more placement groups are inactive on cluster {{ $labels.cluster }}
      expr: |
        ceph_pool_metadata * on(cluster,pool_id,instance) group_left() (ceph_pg_total - ceph_pg_active) > 0
      for: 5m
      labels:
        oid: 1.3.6.1.4.1.50495.1.2.1.7.1
        severity: critical
        type: ceph_default
    - alert: CephPGsUnclean
      annotations:
        description: '{{ $value }} PGs have been unclean for more than 15 minutes in pool {{ $labels.name }}. Unclean PGs have not recovered from a previous failure.'
        summary: One or more placement groups are marked unclean on cluster {{ $labels.cluster }}
      expr: |
        ceph_pool_metadata * on(cluster,pool_id,instance) group_left() (ceph_pg_total - ceph_pg_clean) > 0
      for: 15m
      labels:
        oid: 1.3.6.1.4.1.50495.1.2.1.7.2
        severity: warning
        type: ceph_default
    - alert: CephPGsDamaged
      annotations:
        description: During data consistency checks (scrub), at least one PG has been flagged as being damaged or inconsistent. Check to see which PG is affected, and attempt a manual repair if necessary. To list problematic placement groups, use 'rados list-inconsistent-pg <pool>'. To repair PGs use the 'ceph pg repair <pg_num>' command.
        documentation: https://docs.ceph.com/en/latest/rados/operations/health-checks#pg-damaged
        summary: Placement group damaged, manual intervention needed on cluster {{ $labels.cluster }}
      expr: |
        ceph_health_detail{name=~"PG_DAMAGED|OSD_SCRUB_ERRORS"} == 1
      for: 5m
      labels:
        oid: 1.3.6.1.4.1.50495.1.2.1.7.4
        severity: critical
        type: ceph_default
    - alert: CephPGRecoveryAtRisk
      annotations:
        description: Data redundancy is at risk since one or more OSDs are at or above the 'full' threshold. Add more capacity to the cluster, restore down/out OSDs, or delete unwanted data.
        documentation: https://docs.ceph.com/en/latest/rados/operations/health-checks#pg-recovery-full
        summary: OSDs are too full for recovery on cluster {{ $labels.cluster }}
      expr: |
        ceph_health_detail{name="PG_RECOVERY_FULL"} == 1
      for: 1m
      labels:
        oid: 1.3.6.1.4.1.50495.1.2.1.7.5
        severity: critical
        type: ceph_default
    - alert: CephPGUnavailableBlockingIO
      annotations:
        description: Data availability is reduced, impacting the cluster's ability to service I/O. One or more placement groups (PGs) are in a state that blocks I/O.
        documentation: https://docs.ceph.com/en/latest/rados/operations/health-checks#pg-availability
        summary: PG is unavailable on cluster {{ $labels.cluster }}, blocking I/O
      expr: |
        ((ceph_health_detail{name="PG_AVAILABILITY"} == 1) - scalar(ceph_health_detail{name="OSD_DOWN"})) == 1
      for: 1m
      labels:
        oid: 1.3.6.1.4.1.50495.1.2.1.7.3
        severity: critical
        type: ceph_default
    - alert: CephPGBackfillAtRisk
      annotations:
        description: Data redundancy may be at risk due to lack of free space within the cluster. One or more OSDs have reached the 'backfillfull' threshold. Add more capacity, or delete unwanted data.
        documentation: https://docs.ceph.com/en/latest/rados/operations/health-checks#pg-backfill-full
        summary: Backfill operations are blocked due to lack of free space on cluster {{ $labels.cluster }}
      expr: |
        ceph_health_detail{name="PG_BACKFILL_FULL"} == 1
      for: 1m
      labels:
        oid: 1.3.6.1.4.1.50495.1.2.1.7.6
        severity: critical
        type: ceph_default
    - alert: CephPGNotScrubbed
      annotations:
        description: "One or more PGs have not been scrubbed recently. Scrubs check metadata integrity, protecting against bit-rot. They check that metadata is consistent across data replicas. When PGs miss their scrub interval, it may indicate that the scrub window is too small, or PGs were not in a 'clean' state during the scrub window. You can manually initiate a scrub with: ceph pg scrub <pgid>"
        documentation: https://docs.ceph.com/en/latest/rados/operations/health-checks#pg-not-scrubbed
        summary: Placement group(s) have not been scrubbed on cluster {{ $labels.cluster }}
      expr: |
        ceph_health_detail{name="PG_NOT_SCRUBBED"} == 1
      for: 5m
      labels:
        severity: warning
        type: ceph_default
    - alert: CephPGsHighPerOSD
      annotations:
        description: "The number of placement groups per OSD is too high (exceeds the mon_max_pg_per_osd setting).
          Check that the pg_autoscaler has not been disabled for any pools with 'ceph osd pool autoscale-status', and that the profile selected is appropriate. You may also adjust the target_size_ratio of a pool to guide the autoscaler based on the expected relative size of the pool ('ceph osd pool set cephfs.cephfs.meta target_size_ratio .1') or set the pg_autoscaler mode to 'warn' and adjust pg_num appropriately for one or more pools."
        documentation: https://docs.ceph.com/en/latest/rados/operations/health-checks/#too-many-pgs
        summary: Placement groups per OSD is too high on cluster {{ $labels.cluster }}
      expr: |
        ceph_health_detail{name="TOO_MANY_PGS"} == 1
      for: 1m
      labels:
        severity: warning
        type: ceph_default
    - alert: CephPGNotDeepScrubbed
      annotations:
        description: One or more PGs have not been deep scrubbed recently. Deep scrubs protect against bit-rot. They compare data replicas to ensure consistency. When PGs miss their deep scrub interval, it may indicate that the window is too small or PGs were not in a 'clean' state during the deep-scrub window.
        documentation: https://docs.ceph.com/en/latest/rados/operations/health-checks#pg-not-deep-scrubbed
        summary: Placement group(s) have not been deep scrubbed on cluster {{ $labels.cluster }}
      expr: |
        ceph_health_detail{name="PG_NOT_DEEP_SCRUBBED"} == 1
      for: 5m
      labels:
        severity: warning
        type: ceph_default
  - name: pools
    rules:
    - alert: CephPoolGrowthWarning
      annotations:
        description: Pool '{{ $labels.name }}' will be full in less than 5 days assuming the average fill-up rate of the past 48 hours.
        summary: Pool growth rate may soon exceed capacity on cluster {{ $labels.cluster }}
      expr: |
        (predict_linear(avg by (cluster,pool_id) (ceph_pool_percent_used)[2d:], 3600 * 24 * 5) * on(cluster,pool_id) group_right() avg by (cluster,pool_id, name) (ceph_pool_metadata)) >= 95
      for: 1h
      labels:
        oid: 1.3.6.1.4.1.50495.1.2.1.9.2
        severity: warning
        type: ceph_default
    - alert: CephPoolBackfillFull
      annotations:
        description: A pool is approaching the near full threshold, which will prevent recovery/backfill operations from completing. Consider adding more capacity.
        summary: Free space in a pool is too low for recovery/backfill on cluster {{ $labels.cluster }}
      expr: |
        ceph_health_detail{name="POOL_BACKFILLFULL"} > 0
      labels:
        severity: warning
        type: ceph_default
  - name: healthchecks
    rules:
    - alert: CephDaemonSlowOps
      annotations:
        description: '{{ $labels.ceph_daemon }} operations are taking too long to process (complaint time exceeded)'
        documentation: https://docs.ceph.com/en/latest/rados/operations/health-checks#slow-ops
        summary: '{{ $labels.ceph_daemon }} operations are slow to complete on cluster {{ $labels.cluster }}'
      expr: |
        ceph_daemon_health_metrics{type="SLOW_OPS"} > 0
      for: 30s
      labels:
        severity: warning
        type: ceph_default
  - name: rados
    rules:
    - alert: CephObjectMissing
      annotations:
        description: The latest version of a RADOS object can not be found, even though all OSDs are up. I/O requests for this object from clients will block (hang). Resolving this issue may require the object to be rolled back to a prior version manually, and manually verified.
        documentation: https://docs.ceph.com/en/latest/rados/operations/health-checks#object-unfound
        summary: Object(s) marked UNFOUND on cluster {{ $labels.cluster }}
      expr: |
        (ceph_health_detail{name="OBJECT_UNFOUND"} == 1) * on() group_right(cluster) (count(ceph_osd_up == 1) by (cluster) == bool count(ceph_osd_metadata) by(cluster)) == 1
      for: 30s
      labels:
        oid: 1.3.6.1.4.1.50495.1.2.1.10.1
        severity: critical
        type: ceph_default
  - name: generic
    rules:
    - alert: CephDaemonCrash
      annotations:
        description: One or more daemons have crashed recently, and need to be acknowledged. This notification ensures that software crashes do not go unseen. To acknowledge a crash, use the 'ceph crash archive <id>' command.
        documentation: https://docs.ceph.com/en/latest/rados/operations/health-checks/#recent-crash
        summary: One or more Ceph daemons have crashed, and are pending acknowledgement on cluster {{ $labels.cluster }}
      expr: |
        ceph_health_detail{name="RECENT_CRASH"} == 1
      for: 1m
      labels:
        oid: 1.3.6.1.4.1.50495.1.2.1.1.2
        severity: critical
        type: ceph_default
